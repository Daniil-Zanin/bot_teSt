<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый взгляд на цифровой мир</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="assets/vendor/2832c0ff631d.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #e5e5e5;
            --accent-hover: #ffffff;
            --gradient-start: #1a1a1a;
            --gradient-end: #0a0a0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 80px 24px;
            background: linear-gradient(180deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,255,255,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 50%, rgba(255,255,255,0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-content {
            max-width: 900px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 100px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            letter-spacing: 0.5px;
        }

        .hero-badge-dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .hero-title {
            font-size: clamp(40px, 8vw, 80px);
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 24px;
        }

        .hero-title .highlight {
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: clamp(16px, 2vw, 20px);
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 40px;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            background: var(--text-primary);
            color: var(--bg-primary);
            font-size: 15px;
            font-weight: 500;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .hero-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(255,255,255,0.15);
        }

        .hero-cta-arrow {
            transition: transform 0.3s ease;
        }

        .hero-cta:hover .hero-cta-arrow {
            transform: translateX(4px);
        }

        .hero-image {
            margin-top: 80px;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.1),
                0 40px 80px -20px rgba(0,0,0,0.5);
        }

        .hero-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .hero-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(10,10,10,0.8) 100%);
            pointer-events: none;
        }

        .decorative-grid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: 
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .hero {
                padding: 60px 20px;
            }

            .hero-badge {
                font-size: 12px;
                padding: 6px 12px;
            }

            .hero-subtitle {
                margin-bottom: 32px;
            }

            .hero-image {
                margin-top: 48px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="decorative-grid"></div>
        
        <div class="hero-content">
            <div class="hero-badge">
                <span class="hero-badge-dot"></span>
                Доступно для всех
            </div>
            
            <h1 class="hero-title">
                <span class="highlight">Откройте</span> новые<br>возможности
            </h1>
            
            <p class="hero-subtitle">
                Создаём цифровые решения, которые меняют мир. 
                Современные технологии, минималистичный дизайн, 
                максимальный результат.
            </p>
            
            <a href="#" class="hero-cta">
                Начать проект
                <svg class="hero-cta-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            
            <div class="hero-image">
                <img src="assets/images/8d34fc4621a8.jpg" alt="Современный офис с ноутбуком и растениями">
            </div>
        </div>
    </section>
</body>
</html>
