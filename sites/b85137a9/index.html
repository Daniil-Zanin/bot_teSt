<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создай своё будущее</title>
    <link href="assets/vendor/a432bab0a6d2.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --text: #16213e;
            --light: #f8f9fa;
            --gray: #6c757d;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--light);
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('assets/images/e15a4b1a95cb.jpg') center/cover no-repeat;
            opacity: 0.15;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 800px;
            padding: 40px 20px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(233, 69, 96, 0.2);
            color: var(--accent);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 30px;
            border: 1px solid rgba(233, 69, 96, 0.3);
        }

        .hero h1 {
            font-size: clamp(40px, 8vw, 72px);
            font-weight: 700;
            color: white;
            line-height: 1.1;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: clamp(18px, 3vw, 22px);
            color: rgba(255, 255, 255, 0.7);
            max-width: 600px;
            margin: 0 auto 40px;
            font-weight: 300;
        }

        .cta-button {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 18px 48px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(233, 69, 96, 0.4);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(233, 69, 96, 0.5);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
        }

        .scroll-indicator span {
            display: block;
            width: 24px;
            height: 24px;
            border-right: 2px solid rgba(255, 255, 255, 0.5);
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            transform: rotate(45deg);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-10px); }
            60% { transform: translateX(-50%) translateY(-5px); }
        }

        @media (max-width: 768px) {
            .hero-content {
                padding: 20px;
            }
            
            .cta-button {
                padding: 16px 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <span class="hero-badge">Преобразуй свою жизнь</span>
            <h1>Создай <span>будущее</span>, о котором мечтаешь</h1>
            <p>Получи доступ к инструментам и ресурсам, которые помогут тебе достичь целей быстрее и эффективнее</p>
            <a href="#start" class="cta-button">Начать сейчас</a>
        </div>
        <div class="scroll-indicator">
            <span></span>
        </div>
    </section>
</body>
</html>
