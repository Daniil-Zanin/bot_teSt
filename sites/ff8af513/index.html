<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero — Создай своё будущее</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --text: #ffffff;
            --text-muted: rgba(255,255,255,0.7);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary);
            color: var(--text);
            line-height: 1.6;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(26,26,46,0.9), transparent);
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            text-decoration: none;
        }
        
        .nav {
            display: flex;
            gap: 2rem;
        }
        
        .nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            transition: color 0.3s ease;
        }
        
        .nav a:hover {
            color: var(--text);
        }
        
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 5% 4rem;
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(135deg, rgba(26,26,46,0.85) 0%, rgba(26,26,46,0.7) 100%),
                url('assets/images/e15a4b1a95cb.jpg') center/cover no-repeat;
            z-index: -1;
        }
        
        .hero-content {
            max-width: 800px;
            text-align: center;
        }
        
        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
        }
        
        .hero p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .cta-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: var(--accent);
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 50px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(233,69,96,0.4);
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 1rem 5%;
            }
            
            .nav {
                display: none;
            }
            
            .hero {
                padding-top: 5rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="#" class="logo">Nova</a>
        <nav class="nav">
            <a href="#features">Возможности</a>
            <a href="#about">О нас</a>
            <a href="#contact">Контакты</a>
        </nav>
    </header>
    
    <section class="hero">
        <div class="hero-content">
            <h1>Создай будущее вместе с нами</h1>
            <p>Откройте безграничные возможности для роста и развития. Присоединяйтесь к сообществу единомышленников уже сегодня.</p>
            <a href="#start" class="cta-btn">Начать путь</a>
        </div>
    </section>
</body>
</html>
