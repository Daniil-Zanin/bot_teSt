<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алексей Морозов — Дизайнер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent: #2d2d2d;
            --accent-light: #e8e8e8;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .hero-bg::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0,0,0,0.03) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
        }

        .hero-bg::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0,0,0,0.02) 0%, transparent 70%);
            bottom: -50px;
            left: -50px;
            border-radius: 50%;
            animation: float 15s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .hero-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.04;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 800px;
            padding: 2rem;
        }

        .hero-label {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.2s;
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 300;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.4s;
        }

        .hero-title span {
            display: block;
            font-weight: 500;
        }

        .hero-description {
            font-size: 1.125rem;
            color: var(--text-secondary);
            max-width: 480px;
            margin: 0 auto 2.5rem;
            font-weight: 300;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.6s;
        }

        .hero-cta {
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.8s;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: var(--accent);
            color: var(--bg-primary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            border-radius: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--text-primary);
            transform: translateX(-101%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover::before {
            transform: translateX(0);
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn svg {
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .btn:hover svg {
            transform: translateX(4px);
        }

        .hero-scroll {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 1s, pulse 2s ease-in-out infinite 1.5s;
        }

        .scroll-line {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, var(--accent), transparent);
            margin: 0 auto;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .floating-shapes {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.5;
        }

        .shape-1 {
            width: 8px;
            height: 8px;
            background: var(--accent);
            top: 20%;
            left: 15%;
            animation: shapeFloat 25s ease-in-out infinite;
        }

        .shape-2 {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            top: 30%;
            right: 20%;
            animation: shapeFloat 20s ease-in-out infinite 2s;
        }

        .shape-3 {
            width: 10px;
            height: 10px;
            border: 1px solid var(--accent-light);
            bottom: 25%;
            left: 25%;
            animation: shapeFloat 30s ease-in-out infinite 4s;
        }

        .shape-4 {
            width: 4px;
            height: 4px;
            background: var(--text-secondary);
            bottom: 35%;
            right: 15%;
            animation: shapeFloat 22s ease-in-out infinite 1s;
        }

        @keyframes shapeFloat {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(10px, -20px) rotate(90deg);
            }
            50% {
                transform: translate(-5px, -40px) rotate(180deg);
            }
            75% {
                transform: translate(15px, -20px) rotate(270deg);
            }
        }

        @media (max-width: 768px) {
            .hero-content {
                padding: 1.5rem;
            }

            .hero-description {
                font-size: 1rem;
            }

            .hero-scroll {
                bottom: 2rem;
            }

            .shape {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-bg"></div>
        
        <img 
            src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1920&q=80" 
            alt="" 
            class="hero-image"
            aria-hidden="true"
        >

        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
        </div>

        <div class="hero-content">
            <p class="hero-label">Дизайнер & Разработчик</p>
            <h1 class="hero-title">
                Алексей Морозов
                <span>Создаю цифровые продукты</span>
            </h1>
            <p class="hero-description">
                Проектирую интерфейсы и воплощаю идеи в функциональных цифровых решениях. Минимализм, внимание к деталям, результат.
            </p>
            <div class="hero-cta">
                <a href="mailto:hello@morozov.design" class="btn">
                    <span>Связаться</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </a>
            </div>
        </div>

        <div class="hero-scroll">
            <div class="scroll-line"></div>
        </div>
    </section>
</body>
</html>
