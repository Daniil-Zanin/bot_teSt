<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создайте будущее</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent: #e8c547;
            --accent-hover: #f5d76e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        .hero__bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .hero__bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
        }

        .hero__bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(10, 10, 10, 0.4) 0%,
                rgba(10, 10, 10, 0.7) 100%
            );
        }

        .hero__content {
            position: relative;
            z-index: 1;
            max-width: 900px;
            text-align: center;
        }

        .hero__badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(232, 197, 71, 0.15);
            border: 1px solid var(--accent);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out;
        }

        .hero__title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.8s ease-out 0.1s both;
        }

        .hero__title span {
            color: var(--accent);
        }

        .hero__subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 3rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .hero__cta {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            background: var(--accent);
            color: var(--bg-color);
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .hero__cta:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(232, 197, 71, 0.3);
        }

        .hero__cta svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .hero__cta:hover svg {
            transform: translateX(4px);
        }

        .hero__scroll {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }

        .hero__scroll-line {
            width: 1px;
            height: 60px;
            background: linear-gradient(180deg, var(--accent), transparent);
            animation: scrollPulse 2s ease-in-out infinite;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scrollPulse {
            0%, 100% {
                opacity: 0.5;
                transform: scaleY(1);
            }
            50% {
                opacity: 1;
                transform: scaleY(1.1);
            }
        }

        @media (max-width: 768px) {
            .hero {
                padding: 1.5rem;
            }

            .hero__subtitle {
                margin-bottom: 2rem;
            }

            .hero__scroll {
                display: none;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero__bg">
            <img src="assets/images/e15a4b1a95cb.jpg" alt="Abstract technology background">
        </div>
        
        <div class="hero__content">
            <span class="hero__badge">Инновации будущего</span>
            <h1 class="hero__title">Трансформируйте <span>реальность</span></h1>
            <p class="hero__subtitle">Откройте новые горизонты с нашими передовыми решениями. Технологии, которые меняют мир уже сегодня.</p>
            <a href="#contact" class="hero__cta">
                Начать путь
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>
        </div>

        <div class="hero__scroll">
            <span>Scroll</span>
            <div class="hero__scroll-line"></div>
        </div>
    </section>
</body>
</html>
