<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --text: #ffffff;
            --text-muted: #a0a0b0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--primary);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('assets/images/8b42706f635a.jpg') center/cover;
            opacity: 0.15;
        }

        .hero-content {
            max-width: 800px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid var(--accent);
            border-radius: 50px;
            font-size: 0.875rem;
            color: var(--accent);
            margin-bottom: 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .hero-title span {
            background: linear-gradient(90deg, var(--accent), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 2.5rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out 0.6s both;
            border: none;
            cursor: pointer;
        }

        .hero-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(233, 69, 96, 0.4);
        }

        .hero-cta svg {
            transition: transform 0.3s ease;
        }

        .hero-cta:hover svg {
            transform: translateX(5px);
        }

        .hero-image {
            margin-top: 3rem;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .hero-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .hero {
                padding: 1.5rem;
            }

            .hero-cta {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <div class="hero-badge">Новое поколение сервисов</div>
            <h1 class="hero-title">
                Создайте будущее<br><span>вместе с нами</span>
            </h1>
            <p class="hero-subtitle">
                Откройте для себя возможности, которые открывает перед вами современная платформа. 
                Присоединяйтесь к тысячам пользователей уже сегодня.
            </p>
            <a href="#contact" class="hero-cta">
                Начать путешествие
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>
            <div class="hero-image">
                <img src="assets/images/94b63691dfc6.jpg" alt="Современный офис с ноутбуком и графиками">
            </div>
        </div>
    </section>
</body>
</html>
