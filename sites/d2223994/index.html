<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создайте будущее своего бизнеса</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="assets/vendor/31a62585016e.css" rel="stylesheet">
</head>
<body>
    <section class="hero">
        <div class="hero__overlay"></div>
        <div class="hero__content">
            <span class="hero__badge">Новые возможности</span>
            <h1 class="hero__title">Преобразуйте свой бизнес с цифровыми решениями</h1>
            <p class="hero__subtitle">Мы помогаем компаниям расти, внедряя инновационные технологии и стратегии, которые приводят к реальным результатам</p>
            <div class="hero__actions">
                <a href="#contact" class="hero__btn hero__btn--primary">Начать проект</a>
                <a href="#about" class="hero__btn hero__btn--secondary">Узнать больше</a>
            </div>
            <div class="hero__stats">
                <div class="hero__stat">
                    <span class="hero__stat-number">150+</span>
                    <span class="hero__stat-label">Проектов</span>
                </div>
                <div class="hero__stat">
                    <span class="hero__stat-number">12 лет</span>
                    <span class="hero__stat-label">Опыта</span>
                </div>
                <div class="hero__stat">
                    <span class="hero__stat-number">98%</span>
                    <span class="hero__stat-label">Клиентов</span>
                </div>
            </div>
        </div>
        <div class="hero__scroll">
            <span>Листайте вниз</span>
            <div class="hero__scroll-icon"></div>
        </div>
    </section>
</body>
